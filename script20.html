<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>20 - Calculadora Completa</title></head>
<body>
    <h2>20 - Calculadora Completa</h2>
    <input type="number" id="a" placeholder="Número 1" step="any">
    <input type="number" id="b" placeholder="Número 2" step="any">
    <select id="op">
        <option value="+">Somar (+)</option>
        <option value="-">Subtrair (-)</option>
        <option value="*">Multiplicar (*)</option>
        <option value="/">Dividir (/)</option>
    </select>
    <button onclick="calcular()">Calcular</button>
    <br><br>
     <a href="Home.html">Voltar</a>


    <script>
        function calcular() {
            var a = Number(document.getElementById("a").value);
            var b = Number(document.getElementById("b").value);
            var op = document.getElementById("op").value;
            var r;
            if (op == "+") r = a + b;
            else if (op == "-") r = a - b;
            else if (op == "*") r = a * b;
            else r = a / b;

            var parImpar = (r % 2 == 0) ? "par" : "ímpar";
            var posNeg = (r >= 0) ? "positivo" : "negativo";
            var intDec = (r == Math.floor(r)) ? "inteiro" : "decimal";

            alert("Resultado: " + r +
                  "\nO número é " + parImpar +
                  ", " + posNeg +
                  " e " + intDec);
        }
    </script>
     <style>
        :root{
            --azul-senai:#004a80;
            --laranja: #ff5e00;
            --fundo: #f0f4f8;
            --branco: #FFFFFF;
            --texto: #2c3e50;
            --brancodoinput: #d0d4d4; 
        }
         button{
            background-color: #004a80;
            color: white;
            border: black;
            padding: 12px 30px;
            cursor: pointer;
        }
        input{
              background-color: #d0d4d4;
            color: white;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
        }
        h2{
              background-color: #004d80;
            color: white;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
        }
        a{
            background-color: var(--azul-senai);
            color: white;
            border: none;
            padding: 12px 200px;
            cursor: pointer;
        }
        option{
            background-color: #718fa5;
            color: rgb(8, 2, 2);
            border: none;
            padding: 12px 200px;
            cursor: pointer;
        }
    </style>
</body>
</html>
