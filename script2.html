<!DOCTYPE html>

<body>
    <h2>2) Média do aluno</h2>
    <input type="number" id="n1" placeholder="Nota 1">
    <input type="number" id="n2" placeholder="Nota 2">
    <button onclick="calcular()">Calcular</button><br><br><br>
   <a href="Home.html">Voltar</a>

    <script>
        function calcular() {
            var n1 = Number(document.getElementById("n1").value);
            var n2 = Number(document.getElementById("n2").value);
            var media = (n1 + n2) / 2;
            if (media == 10) {
                alert("Média: " + media + "\nAprovado com folga!!");
            } else if (media >= 7) {
                alert("Média: " + media + "\nAprovado!");
            } else {
                alert("Média: " + media + "\nReprovado!");
            }
        }
    </script>
