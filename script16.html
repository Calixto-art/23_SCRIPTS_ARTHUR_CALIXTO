<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>16 - Par ou Ímpar</title></head>
<body>
    <h2>16 - Par ou Ímpar</h2>
    <input type="number" id="n" placeholder="Digite um inteiro">
    <button onclick="ver()">Verificar</button>
    <br><br>
     <a href="Home.html">Voltar</a>


    <script>
        function ver() {
            var n = Number(document.getElementById("n").value);
            if (n % 2 == 0) alert(n + " é PAR");
            else alert(n + " é ÍMPAR");
        }
    </script>
