<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>22 - Posto de Combustível</title></head>
<body>
    <h2>22 - Posto de Combustível</h2>
    <input type="number" id="litros" placeholder="Litros" step="any">
    <input type="text" id="tipo" maxlength="1" placeholder="A ou G">
    <button onclick="calcular()">Calcular</button>
    <br><br>
     <a href="Home.html">Voltar</a>


    <script>
        function calcular() {
            var l = Number(document.getElementById("litros").value);
            var t = document.getElementById("tipo").value.toUpperCase();
            var preco, desc;
            if (t == "A") {
                preco = 4.39;
                desc = (l <= 20) ? 0.03 : 0.05;
            } else if (t == "G") {
                preco = 6.79;
                desc = (l <= 20) ? 0.04 : 0.06;
            } else {
                alert("Tipo inválido");
                return;
            }
            var total = l * preco;
            var desconto = total * desc;
            var pagar = total - desconto;
            alert("Total bruto: R$ " + total.toFixed(2) +
                  "\nDesconto: R$ " + desconto.toFixed(2) +
                  "\nValor a pagar: R$ " + pagar.toFixed(2));
        }
    </script>
     <style>
        :root{
            --azul-senai:#004a80;
            --laranja: #ff5e00;
            --fundo: #f0f4f8;
            --branco: #FFFFFF;
            --texto: #2c3e50;
            --brancodoinput: #d0d4d4; 
        }
         button{
            background-color: #004a80;
            color: white;
            border: black;
            padding: 12px 30px;
            cursor: pointer;
        }
        input{
              background-color: #d0d4d4;
            color: white;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
        }
        h2{
              background-color: #004d80;
            color: white;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
        }
        a{
            background-color: var(--azul-senai);
            color: white;
            border: none;
            padding: 12px 200px;
            cursor: pointer;
        }
    </style>
</body>
</html>
