<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>18 - Caixa Eletrônico</title></head>
<body>
    <h2>18 - Caixa Eletrônico</h2>
    <input type="number" id="v" placeholder="Valor do saque (10 a 900)">
    <button onclick="sacar()">Sacar</button>
    <br><br>
     <a href="Home.html">Voltar</a>


    <script>
        function sacar() {
            var v = Number(document.getElementById("v").value);
            if (v < 10 || v > 900) { alert("Valor inválido (mínimo 10, máximo 900)"); return; }
            if (v % 10 != 0) { alert("Valor deve ser múltiplo de 10"); return; }
            var n100 = Math.floor(v / 100); v = v % 100;
            var n50 = Math.floor(v / 50);   v = v % 50;
            var n20 = Math.floor(v / 20);   v = v % 20;
            var n10 = Math.floor(v / 10);
            alert("Notas de R$ 100: " + n100 +
                  "\nNotas de R$ 50: " + n50 +
                  "\nNotas de R$ 20: " + n20 +
                  "\nNotas de R$ 10: " + n10);
        }
    </script>
     <style>
        :root{
            --azul-senai:#004a80;
            --laranja: #ff5e00;
            --fundo: #f0f4f8;
            --branco: #FFFFFF;
            --texto: #2c3e50;
            --brancodoinput: #d0d4d4; 
        }
         button{
            background-color: #004a80;
            color: white;
            border: black;
            padding: 12px 30px;
            cursor: pointer;
        }
        input{
              background-color: #d0d4d4;
            color: white;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
        }
        h2{
              background-color: #004d80;
            color: white;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
        }
        a{
            background-color: var(--azul-senai);
            color: white;
            border: none;
            padding: 12px 200px;
            cursor: pointer;
        }
    </style>
</body>
</html>
