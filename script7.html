<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>7</title></head>
<body>
    <h2>7) Horario de estudos</h2>
    <input type="text" id="turno" maxlength="1" placeholder="M, V ou N">
    <button onclick="verificar()">Verificar</button><br><br><a href="Home.html">Voltar</a>

    <script>
        function verificar() {
            var t = document.getElementById("turno").value.toUpperCase();
            if (t == "M") alert("Bom Dia!");
            else if (t == "V") alert("Boa Tarde!");
            else if (t == "N") alert("Boa Noite!");
            else alert("Valor Inválido!");
        }
    </script>

        }
         button{

</body>
