<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        :root{
            --azul-senai:#004a80;
            --laranja: #ff5e00;
            --fundo: #f0f4f8;
            --branco: #FFFFFF;
            --texto: #2c3e50;
        }
        /* formatação geral*/
        body{
            background-color: var(--fundo);
            font-family: 'Segoe ui',sans-serif;  
            color: var(--texto);
        }
        /*formatar header*/
        header{
            background-color: var(--azul-senai);
            color: var(--branco);
            display: flex;
            align-items: center;
            padding: 20px;
            justify-content: space-between;
            border-bottom: 5px solid var(--laranja);
        }
        .logo-area img{
            height: 40px;
        }
        .titulo-area h1 span{
            color:var(--laranja);
        }
        .spacer{
            width: 150px;
        }
        /* formatando a main */
        main{
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        /* formatar seção de monitoramento */
        .monitoramento{
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
        }
        .info-card{
            background-color: var(--branco);
            flex: 1;
            padding: 30px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0 0 0 0.05);
            border-left: 5px solid var(--azul-senai);
        }
        .dispositivos-grid{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
            gap: 30px;
        }
        .card{
            background-color: white;
            width: 320px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .card-icon{
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .card h3{
            margin-bottom: 10px;
            color: #004a80;
        }
        .card .status{
            margin-bottom: 25px;
            color: #666;
        }
        .btn{
            background-color: #004a80;
            color: white;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
        }
        footer{
            text-align: center;
            padding: 20px;
            background-color: #004a80;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
