<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>4</title></head>
<body>
    <h2>4)A troca de variáveis</h2>
    
    <input type="number" id="a" placeholder="Valor de A">
    <input type="number" id="b" placeholder="Valor de B">
    <button onclick="trocar()">Trocar</button><br><br>
    <a href="Home.html">Voltar</a>

    <script>
        function trocar() {
            var a = Number(document.getElementById("a").value);
            var b = Number(document.getElementById("b").value);
            alert("ANTES:\nA = " + a + "\nB = " + b);
            var temp = a;
            a = b;
            b = temp;
            alert("DEPOIS:\nA = " + a + "\nB = " + b);
        }
    </script>

</body>
